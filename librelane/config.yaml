meta:
  flow: Classic
  substituting_steps:
    Checker.DisconnectedPins: null

    # Promote power pins
    +Odb.ManualMacroPlacement: Odb.FABulousPower
    
    # Convert power pins
    +OpenROAD.GeneratePDN: Odb.CustomPDN
    
    # Check the power grid
    +Odb.CustomPDN: OpenROAD.CheckPowerGrid
    
    # Add KLayout antenna checks
    +KLayout.DRC: KLayout.Antenna
    +KLayout.Antenna: Checker.KLayoutAntenna
    
    # Disable due to issues
    OpenROAD.IRDropReport: null
    Checker.YosysUnmappedCells: null

# TODO: magic creates additional copies of the macro subcells
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

DESIGN_NAME: tt_um_fabulous_boat_26
VERILOG_FILES:
  - dir::../src/tt_um_fabulous_boat_26.sv
  - dir::../src/memory_config.sv
  - dir::../ip/fabric_config/fabric_config.sv
  - dir::../ip/fabric_bitbang/fabric_bitbang.sv
  
CLOCK_PORT: clk
CLOCK_PERIOD: 20 # 20ns = 50MHz

# Double the hold slack
PL_RESIZER_HOLD_SLACK_MARGIN: 0.2
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.1

FP_SIZING: "absolute"
DIE_AREA: [0, 0, expr::(2880.640/2), expr::(3120.320/2)]
FP_DEF_TEMPLATE: dir::tt_block_4x8_pgvdd.def

PDN_CFG: dir::pdn_cfg.tcl
#PDN_EXTEND_TO: "boundary"

PDN_VOFFSET: 20
PDN_VPITCH: 50
PDN_VWIDTH: 3.2

PL_TARGET_DENSITY_PCT: 40 #45
GRT_ALLOW_CONGESTION: true

VDD_NETS: [VPWR]
GND_NETS: [VGND]

RT_MAX_LAYER: Metal4
PDN_MULTILAYER: False

DIODE_ON_PORTS: both

# Don't add output buffers,
# can lead to antenna violations
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: False

# Width should be multiple of 0.56 (Metal2 pitch)
# Height should be multiple of 0.56 (Metal3 pitch)
# Standard cell row height: 3.92 (8 Metal3 tracks)
FP_MACRO_HORIZONTAL_HALO: expr::(0.56 * 8)
FP_MACRO_VERTICAL_HALO: expr::(0.56 * 8)
PDN_HORIZONTAL_HALO: expr::(0.56 * 8)
PDN_VERTICAL_HALO: expr::(0.56 * 8)

# Save some more core area
TOP_MARGIN_MULT: 1
BOTTOM_MARGIN_MULT: 1

LEFT_MARGIN_MULT: 4
RIGHT_MARGIN_MULT: 1

#FP_OBSTRUCTIONS:
#- [expr::(0.56 * (2374)), 0, "expr::$DIE_AREA[2]", "expr::($DIE_AREA[3] - (0.56 * 112))"]

PL_SOFT_OBSTRUCTIONS:
- [expr::(0.56 * (2374)), 0, "expr::$DIE_AREA[2]", "expr::($DIE_AREA[3] - (0.56 * 112))"]

MACROS:
  # Fabric
  tiny_fabric_boat_26:
    gds:
      - dir::../fabrics/tiny_fabric_boat_26/macro/gf180mcuD/gds/tiny_fabric_boat_26.gds
    lef:
      - dir::../fabrics/tiny_fabric_boat_26/macro/gf180mcuD/lef/tiny_fabric_boat_26.lef
    nl:
      - dir::../fabrics/tiny_fabric_boat_26/macro/gf180mcuD/nl/tiny_fabric_boat_26.nl.v
    instances:
      tiny_fabric_boat_26:
        location: [expr::(0.56 * 200), expr::(3.92 * 75)]
        orientation: FS

  # 3.3V SRAM
  gf180mcu_ocd_ip_sram__sram256x8m8wm1:
    gds:
      - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/gds/gf180mcu_ocd_ip_sram__sram256x8m8wm1.gds
    lef:
      - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lef/gf180mcu_ocd_ip_sram__sram256x8m8wm1.lef
    vh:
      - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/verilog/gf180mcu_ocd_ip_sram__sram256x8m8wm1__blackbox_pp.v
    lib:
      "*_tt_025C_3v30":
        - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lib/gf180mcu_ocd_ip_sram__sram256x8m8wm1__tt_025C_3v30.lib
      "*_ff_n40C_3v60":
        - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lib/gf180mcu_ocd_ip_sram__sram256x8m8wm1__ff_n40C_3v60.lib
      "*_ss_125C_3v00":
        - pdk_dir::libs.ref/gf180mcu_ocd_ip_sram/lib/gf180mcu_ocd_ip_sram__sram256x8m8wm1__ss_125C_3v00.lib
    instances:
      sram_0:
        location: [expr::((0.56 * 200) + 0), expr::(3.92 * 1)]
        orientation: FS
      sram_1:
        location: [expr::((0.56 * 200) + 321), expr::(3.92 * 1)]
        orientation: FS
      sram_2:
        location: [expr::((0.56 * 200) + 642), expr::(3.92 * 1)]
        orientation: FS
      sram_3:
        location: [expr::((0.56 * 200) + 963), expr::(3.92 * 1)]
        orientation: FS

ERROR_ON_PDN_VIOLATIONS: False

PDN_MACRO_CONNECTIONS:
- "tiny_fabric_boat_26 VPWR VGND VPWR VGND"

# No extract-unique, because the power straps
# are connected in the top-level integration
MAGIC_EXT_UNIQUE: notopports

# Tiny Tapeout expects pins to match the template DEF
MAGIC_WRITE_LEF_PINONLY: true

INSERT_ECO_DIODES:
- target: tiny_fabric_boat_26/Tile_X1Y5_A_OUT_top
- target: tiny_fabric_boat_26/Tile_X1Y5_B_OUT_top
- target: tiny_fabric_boat_26/Tile_X0Y2_A_OUT_top
- target: tiny_fabric_boat_26/Tile_X0Y2_B_OUT_top
- target: tiny_fabric_boat_26/Tile_X0Y2_C_OUT_top
- target: tiny_fabric_boat_26/Tile_X0Y2_D_OUT_top
- target: tiny_fabric_boat_26/Tile_X0Y1_A_OUT_top
- target: tiny_fabric_boat_26/Tile_X0Y1_B_OUT_top
- target: tiny_fabric_boat_26/Tile_X0Y1_C_OUT_top
- target: tiny_fabric_boat_26/Tile_X0Y1_D_OUT_top

DESIGN_REPAIR_MAX_WIRE_LENGTH: 500

# Image render settings
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

# DRC settings
# A high number of workers increases RAM usage,
# but can significantly improve the performance.
# workers * threads should equal the available
# hardware threads for a best possible utilization.

KLAYOUT_DRC_THREADS: 1

# "max" equals max hardware threads
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max
